name: Test Nixcare

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Package and regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build package and run regression checks
        run: nix flake check --print-build-logs --max-jobs 1 --cores 2
      - name: Verify public entrypoint
        run: |
          nix run . -- --version
          nix run . -- --help
          nix run . -- optimise --dry-run
      - name: Exercise real Git and Nix input isolation
        run: NIXCARE_INTEGRATION=1 python3 -m unittest discover -s test -p 'test_portable_integration.py' -v
  nixos:
    name: Evaluate minimal NixOS module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate generic host without telemetry
        run: |
          nix eval --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              host = flake.inputs.nixpkgs.lib.nixosSystem {
                system = "x86_64-linux";
                modules = [
                  flake.nixosModules.default
                  {
                    services.nixcare.enable = true;
                    system.stateVersion = "24.11";
                    boot.loader.grub.enable = false;
                    fileSystems."/" = { device = "/dev/vda"; fsType = "ext4"; };
                  }
                ];
              };
            in host.config.system.build.toplevel.drvPath
          '
      - name: Verify optional browser policies
        run: nix eval --impure --file test/nixos-module.nix
